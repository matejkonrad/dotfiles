onboarding = false
# herdr configuration — symlinked to ~/.config/herdr/config.toml (see dotfiles.toml).
#
# Keymap tiers (macOS: Ghostty has macos-option-as-alt = true, so option == alt
# reaches herdr; word-nav uses alt+f/b/d, which never clash with alt+h/j/k/l):
#
#   ctrl+h/j/k/l ....... NAVIGATE — seamless across nvim splits AND herdr panes
#   ctrl+arrows ........ focus the adjacent herdr pane (plain, non-nvim-aware)
#   option+h/j/k/l ..... RESIZE   — seamless across nvim splits AND herdr panes
#   ctrl+option+j/k .... next / previous WORKSPACE  (also ctrl+opt+down/up)
#   ctrl+option+h/l .... previous / next TAB         (also ctrl+opt+left/right)
#   ctrl+option+p/n .... previous / next AGENT
#   option + ........... pane ops (split / zoom / close)
#   prefix (ctrl+b) .... the long tail (new tab/workspace, rename, copy-mode…)
#
# The seamless behaviour is split across two plugins, both bound at the bottom of
# this file via [[keys.command]] plugin_action:
#   ctrl+hjkl NAV ..... herdr-nvim-nav (github:aimdevlee/herdr-nvim-nav) — a C
#                       binary + marker file, ~3ms per press. Neovim side in
#                       config/nvim/lua/plugins/herdr-nvim-nav.lua.
#   option+hjkl RESIZE  herdr-splits (github:lmilojevicc/herdr-splits.nvim) —
#                       kept only for resize, herdr-nvim-nav has no resize.
#                       Neovim side in config/nvim/lua/plugins/herdr-splits.lua.
# Install the herdr sides with:
#   herdr plugin install aimdevlee/herdr-nvim-nav
#   herdr plugin install lmilojevicc/herdr-splits.nvim
#
# Reload after editing:  herdr server reload-config   (or prefix+shift+r)

[keys]
prefix = "ctrl+b"

# --- Panes: focus (prefix h/j/k/l + ctrl+arrows) ---
# Seamless ctrl+h/j/k/l nav is owned by herdr-nvim-nav (see [[keys.command]] below),
# so it is intentionally NOT set here. ctrl+arrows give a plain, always-herdr jump.
focus_pane_left = ["prefix+h", "ctrl+left"]
focus_pane_down = ["prefix+j", "ctrl+down"]
focus_pane_up = ["prefix+k", "ctrl+up"]
focus_pane_right = ["prefix+l", "ctrl+right"]

# --- Panes: split (v = right/side-by-side, minus = down/stacked) ---
split_vertical = ["prefix+v", "alt+v"]           # right / side-by-side
split_horizontal = ["prefix+minus", "alt+minus"] # down / stacked

# --- Panes: zoom + close ---
# zoom = fullscreen one pane, press again to restore. alt+/ mirrors tmux's M-/.
zoom = ["prefix+z", "prefix+f", "alt+z", "alt+/", "ctrl+alt+/"]
close_pane = ["prefix+x", "alt+w"]

# Resize mode kept as a prefix fallback; primary resize is option+h/j/k/l
# (herdr-splits, seamless with nvim). In this mode use h/j/k/l or arrows, esc to exit.
resize_mode = "prefix+r"

# --- Tabs (inside a workspace) ---
new_tab = "prefix+c"
previous_tab = ["prefix+p", "ctrl+alt+h", "ctrl+alt+left"]
next_tab = ["prefix+n", "ctrl+alt+l", "ctrl+alt+right"]
switch_tab = "prefix+1..9"                                 # goto tab by number
close_tab = "prefix+shift+x"
rename_tab = ["prefix+comma", "prefix+shift+t"]

# --- Workspaces (projects — the sidebar list) ---
# Vertical keys for the vertical sidebar: k = up = previous, j = down = next.
previous_workspace = ["ctrl+alt+k", "ctrl+alt+up"]
next_workspace = ["ctrl+alt+j", "ctrl+alt+down"]
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
switch_workspace = "prefix+shift+1..9"             # goto workspace by number

# --- Worktrees (g = git; each worktree opens as its own workspace) ---
# Create (prefix+shift+g) and remove (prefix+ctrl+g) are [[keys.command]] popups
# below, not the built-ins: new_worktree only works on the parent repo row, and
# remove_worktree deletes the checkout synchronously and freezes herdr for the
# whole rm of node_modules.
open_worktree = "prefix+g" # pick an existing worktree of the selected repo

# --- Agents (cycle focus between live agent panes) ---
# p = previous, n = next (mnemonic; tabs took h/l, workspaces took j/k).
previous_agent = "ctrl+alt+p"
next_agent = "ctrl+alt+n"

# --- Scrollback / copy mode ---
edit_scrollback = "prefix+s" # prefix+e is the herdr-nvim sidebar

# --- Session / misc ---
detach = "prefix+q"
reload_config = "prefix+shift+r"
settings = "prefix+shift+s"
toggle_sidebar = "ctrl+alt+b"

# --- Seamless nav across nvim splits and herdr panes (herdr-nvim-nav) ---
# When the focused pane runs nvim (marker file in $XDG_CACHE_HOME/herdr/nvim-panes),
# the chord is forwarded into nvim so its own splits move first, crossing into
# herdr panes at the edge. Otherwise herdr moves pane focus directly.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim/herdr)"

# --- New worktree from any checkout of the repo ---
# The CLI resolves the repo from a linked worktree too, so this works from main
# or from another worktree. The branch starts from a fresh origin/HEAD.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
description = "new worktree (from any checkout of the repo)"
width = "60%"
height = "30%"
command = '''
cd "$HERDR_ACTIVE_PANE_CWD" || exit 1
base=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null || echo origin/main)
printf 'New branch (from %s): ' "$base"
read -r branch
[ -n "$branch" ] || exit 0
git fetch --quiet origin "${base#origin/}"
if ! herdr worktree create --cwd "$PWD" --branch "$branch" --base "$base" --label "$branch" --focus >/dev/null; then
  printf '\nPress enter to close.'; read -r _
fi
'''

# --- Remove the focused worktree without blocking herdr ---
# The checkout is moved into a trash dir (same volume, instant), pruned from
# git, and rm'd in the background. Refuses the main checkout, asks again when
# dirty. The branch is kept.
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
description = "remove worktree (background delete)"
width = "70%"
height = "40%"
command = '''
cd "$HERDR_ACTIVE_PANE_CWD" || exit 1
top=$(git rev-parse --show-toplevel) || exit 1
common=$(cd "$(git rev-parse --git-common-dir)" && pwd)
if [ "$(cd "$(git rev-parse --git-dir)" && pwd)" = "$common" ]; then
  printf 'This is the main checkout, not a worktree.\nPress enter to close.'; read -r _; exit 1
fi
if [ -n "$(git status --porcelain)" ]; then
  git status --short
  printf '\nWorktree has changes. Remove anyway? [y/N] '
else
  printf 'Remove worktree %s? [y/N] ' "$top"
fi
read -r answer
[ "$answer" = y ] || exit 0
cd "$common/.." || exit 1
trash=$(mktemp -d "${TMPDIR:-/tmp}/herdr-wt-trash.XXXXXX")
mv "$top" "$trash/" && git worktree prune
(rm -rf "$trash" >/dev/null 2>&1 &)
herdr workspace close "$HERDR_ACTIVE_WORKSPACE_ID"
'''

# --- PR board (herdr-pr, config/herdr/plugins/herdr-pr) ---
# Popup for the focused workspace: stack, checks, comments, fix and auto-fix.
[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "herdr-pr.board"
description = "PR board"

# --- nvim sidebar (herdr-nvim, github:ChmaraX/herdr-nvim) ---
# A persistent per-tab nvim on the right half of the tab. The nvim side
# (annotations) is config/nvim/lua/plugins/herdr-nvim.lua.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# --- Seamless resize across nvim splits and herdr panes (herdr-splits) ---
# option(alt)+h/j/k/l resize nvim splits first, delegating to herdr when a split
# already fills the pane.
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left (nvim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down (nvim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up (nvim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right (nvim/herdr)"

# >>> theme block — written by `theme fesper|gruvbox` (scripts/theme) from themes/<name>.toml
# Fesper — the palette of config/zed/themes/fesper.json, matching Ghostty
# themes/Fesper and nvim colors/fesper.lua. Every token is set, so the base
# theme only supplies structure. The surface/overlay tokens give the tab bar
# its contrast: without them the tabs blend into one strip.
[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
panel_bg = "#1a1a1a"      # background
sidebar_bg = "#1a1a1a"
surface_dim = "#2a2a2a"   # border — separators
active_row_bg = "#232323" # element.selected
selection_bg = "#282828"  # ghost_element.hover
surface0 = "#282828"      # inactive tab
surface1 = "#343434"      # scrollbar thumb
overlay0 = "#7e7e7e"      # inactive tab text (placeholder)
overlay1 = "#a0a0a0"      # named inactive tab text (muted)
subtext0 = "#a0a0a0"      # muted text
text = "#a6a6a6"
accent = "#ffc799"
red = "#ff8080"
green = "#99ffe4"         # success / created
yellow = "#ffc799"
blue = "#aca1cf"
mauve = "#e29eca"
peach = "#ffb47a"         # syntax type
teal = "#8cd9b2"          # syntax string
# <<< theme block

# Where prefix+shift+g / `herdr worktree create` put worktrees (herdr adds
# <repo>/<branch> below it). Matches worktrunk's worktree-path.
[worktrees]
directory = "~/Projects/worktrees"

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = false

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/matejkonrad/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar${HERDR_SESSION:+-$HERDR_SESSION}.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

# herdr-automatic-rename names new tabs (process or agent session), so no prompt.
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
# tmux-style splits: a single thin divider between panes, nothing else.
# Default draws a frame around the whole pane area, a gap between panes (so
# every pane gets its own full box) and a scrollbar column — too much chrome
# with several panes open. pane_borders stays "auto": dividers only appear
# when a tab actually has splits, a lone/zoomed pane is frameless.
pane_borders = "auto"
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false

