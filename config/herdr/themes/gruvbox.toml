# Gruvbox Material (hard, dark) — matches Ghostty "Gruvbox Material Dark" with
# background = #1d2021 and nvim gruvbox_material_background = "hard". herdr only
# ships plain gruvbox, so the material palette is layered on top via [theme.custom].
# One background everywhere; surface_dim draws the only chrome: the sidebar
# edge │ and the section ─ dividers.
[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
panel_bg = "#1d2021"      # bg0
sidebar_bg = "#1d2021"    # bg0
surface_dim = "#3c3836"   # bg3 — separators
active_row_bg = "#282828" # bg1
selection_bg = "#3c3836"  # bg3
text = "#d4be98"          # fg0
accent = "#d8a657"        # yellow
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
mauve = "#d3869b"         # purple
peach = "#e78a4e"         # orange
teal = "#89b482"          # aqua
