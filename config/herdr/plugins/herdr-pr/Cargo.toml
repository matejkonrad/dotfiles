[package]
name = "herdr-pr"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
libc = "0.2.190"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "process", "time", "sync", "fs"] }
toml = "1.1.8"

[profile.release]
strip = true
lto = "thin"
